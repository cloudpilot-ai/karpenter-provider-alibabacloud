name: Latest image build

on:
  push:
    branches: [ "main" ]

jobs:
  latest-image-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: optimizer-publish-${{ github.repository }}-latest
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate image publishing configuration
        env:
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SK }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${ALIYUN_REGISTRY:?ALIYUN_REGISTRY is required}"
          : "${ACR_USERNAME:?ALIYUN_REGISTRY_USERNAME is required}"
          : "${ACR_PASSWORD:?ALIYUN_REGISTRY_PASSWORD is required}"
          : "${AWS_ACCESS_KEY_ID:?AWS_AK is required}"
          : "${AWS_SECRET_ACCESS_KEY:?AWS_SK is required}"
          : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN is required}"
          [[ "$ALIYUN_REGISTRY" =~ ^[a-z0-9]+([.-][a-z0-9]+)*$ ]] || {
            echo 'ALIYUN_REGISTRY must be a registry hostname without a scheme or path' >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_AK }}
          aws-secret-access-key: ${{ secrets.AWS_SK }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: ko-build/setup-ko@v0.6

      - name: Build and publish image once
        id: image
        env:
          IMAGE_TAG: latest
        run: |
          export KO_DOCKER_REPO=public.ecr.aws/cloudpilotai/karpenter-provider-alibabacloud
          IMAGE=$(ko build --bare github.com/cloudpilot-ai/karpenter-provider-alibabacloud/cmd/controller -t "$IMAGE_TAG")
          IMAGE=${IMAGE/":$IMAGE_TAG@"/@}
          [[ "$IMAGE" =~ ^public\.ecr\.aws/cloudpilotai/karpenter-provider-alibabacloud@sha256:[a-f0-9]{64}$ ]] || {
            echo 'Expected exactly one digest-qualified controller image from ko build' >&2
            exit 1
          }
          echo "reference=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Save mirror requests before copying
        id: mirror-request
        env:
          SOURCE_REF: ${{ steps.image.outputs.reference }}
          ALIYUN_REPOSITORY: ${{ vars.ALIYUN_REGISTRY }}/cloudpilotai/karpenter-provider-alibabacloud
          IMAGE_TAG: latest
        run: |
          IMMUTABLE_TAGS='[]'
          MUTABLE_TAGS='[]'
          if [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IMMUTABLE_TAGS=$(jq -cn --arg tag "$IMAGE_TAG" '[$tag]')
          else
            MUTABLE_TAGS=$(jq -cn --arg tag "$IMAGE_TAG" '[$tag]')
          fi
          # Both requests use the original build digest, including after a partial copy failure.
          for DESTINATION in dockerhub aliyun; do
            TARGET_REPOSITORY=docker.io/cloudpilotai/karpenter-provider-alibabacloud
            if [[ "$DESTINATION" == aliyun ]]; then
              TARGET_REPOSITORY=$ALIYUN_REPOSITORY
            fi
            jq -n --arg source "$SOURCE_REF" --arg target "$TARGET_REPOSITORY" \
              --argjson immutable "$IMMUTABLE_TAGS" --argjson mutable "$MUTABLE_TAGS" \
              '{schemaVersion: 1, sourceRef: $source, targetRepository: $target,
                immutableTags: $immutable, mutableTags: $mutable}' > "$RUNNER_TEMP/mirror-request-$DESTINATION.json"
          done
          echo "immutable-tags-json=$IMMUTABLE_TAGS" >> "$GITHUB_OUTPUT"
          echo "mutable-tags-json=$MUTABLE_TAGS" >> "$GITHUB_OUTPUT"

      # Release source refs may predate the delivery tool; load it from this workflow revision.
      - name: Check out the reviewed mirror tool
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .mirror-tools
          sparse-checkout: .github/actions/mirror-container-image
          persist-credentials: false

      - name: Preserve DockerHub image tags from the original build
        uses: ./.mirror-tools/.github/actions/mirror-container-image
        with:
          source-ref: ${{ steps.image.outputs.reference }}
          target-repository: docker.io/cloudpilotai/karpenter-provider-alibabacloud
          immutable-tags-json: ${{ steps.mirror-request.outputs.immutable-tags-json }}
          mutable-tags-json: ${{ steps.mirror-request.outputs.mutable-tags-json }}
        env:
          ACR_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          ACR_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror and verify Alibaba Cloud image
        if: ${{ !cancelled() && steps.mirror-request.outcome == 'success' }}
        uses: ./.mirror-tools/.github/actions/mirror-container-image
        with:
          source-ref: ${{ steps.image.outputs.reference }}
          target-repository: ${{ vars.ALIYUN_REGISTRY }}/cloudpilotai/karpenter-provider-alibabacloud
          immutable-tags-json: ${{ steps.mirror-request.outputs.immutable-tags-json }}
          mutable-tags-json: ${{ steps.mirror-request.outputs.mutable-tags-json }}
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Retain mirror requests and verification evidence
        if: ${{ always() && steps.image.outputs.reference != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-mirror-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mirror-request-*.json
            ${{ runner.temp }}/mirror-container-image/
          if-no-files-found: error
